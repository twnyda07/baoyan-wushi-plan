<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>寶嚴教育平台・規劃文件</title>
<style>
  :root{
    --paper:#faf8f4; --paper2:#f2eee6; --card:#ffffff;
    --ink:#2b2622; --ink2:#5c5349; --ink3:#857a6c;
    --rule:#ddd4c6; --blue:#3a5a6b; --lotus:#8a6a86;
  }
  @media(prefers-color-scheme:dark){
    :root{--paper:#1a1816; --paper2:#211e1b; --card:#24201c;
      --ink:#ece5d9; --ink2:#b3a996; --ink3:#8a8070; --rule:#39332b;
      --blue:#8fb3c4; --lotus:#c09cbb}
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink);
    font-family:"Noto Serif TC","Songti TC","PingFang TC",serif;
    font-size:17px; line-height:1.8; -webkit-font-smoothing:antialiased}
  .sans{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  .wrap{max-width:680px; margin:0 auto; padding:64px 24px 100px}
  .mark{font-size:26px; letter-spacing:.3em; color:var(--blue); font-weight:700; margin-bottom:10px}
  h1{font-size:26px; margin:0 0 10px; letter-spacing:.03em; font-weight:700}
  .sub{color:var(--ink2); font-size:15px; margin:0 0 40px; line-height:1.7}
  .doc{display:block; text-decoration:none; color:inherit; border:1px solid var(--rule);
    background:var(--card); border-radius:6px; padding:22px 24px; margin:16px 0; transition:border-color .15s, transform .15s}
  .doc:hover{border-color:var(--lotus); transform:translateY(-1px)}
  .doc:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
  .doc .tag{font-family:"PingFang TC","Noto Sans TC",sans-serif; font-size:12px; letter-spacing:.1em;
    color:var(--lotus); font-weight:700; display:block; margin-bottom:8px}
  .doc h2{font-size:20px; margin:0 0 6px; font-weight:700; color:var(--ink)}
  .doc p{margin:0 0 12px; font-size:15px; color:var(--ink2); line-height:1.65}
  .doc .go{font-family:"PingFang TC","Noto Sans TC",sans-serif; font-size:14px; font-weight:600; color:var(--blue)}
  .doc .go::after{content:" →"}
  .foot{margin-top:40px; padding-top:20px; border-top:1px solid var(--rule);
    font-family:"PingFang TC","Noto Sans TC",sans-serif; font-size:13px; color:var(--ink3); line-height:1.8}
  @media(max-width:560px){.wrap{padding:40px 16px 70px} h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">寶　嚴</div>
  <h1>教育平台・規劃文件</h1>
  <p class="sub">內部討論文件。點選文件開啟，各需密碼。</p>

    <span class="go sans">開啟（需密碼）</span>
  </a>

  <a class="doc" href="gamification.html">

  <div class="foot">
    四方顧問（教理・學習・技術・治理）於本機隔離作業，未使用外部 AI、未外流。<br>
    文件以 AES-256 加密，密碼請向主事者索取。請勿轉傳或公開。
  </div>
</div>
</body>
</html>
