  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(DATA.iv)},key,b64d(DATA.ct));
  $('gate').remove();$('doc').innerHTML=new TextDecoder().decode(plain);$('doc').style.display='block';window.scrollTo(0,0);
 }catch(err){$('msg').style.color='var(--red)';$('msg').textContent='密碼不正確，請再試一次';$('go').disabled=false;$('pw').value='';$('pw').focus();}
