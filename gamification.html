<style>
:root{--paper:#faf8f4;--paper2:#f2eee6;--ink:#2b2622;--ink2:#5c5349;--rule:#ddd4c6;--accent:#8a6a86;--red:#9c4a3c}
@media(prefers-color-scheme:dark){:root{--paper:#1a1816;--paper2:#24201c;--ink:#ece5d9;--ink2:#b3a996;--rule:#39332b;--accent:#c09cbb;--red:#d08274}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PingFang TC",serif;font-size:17px;line-height:1.8}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.lock{width:100%;max-width:430px;text-align:center}
.mark{font-size:30px;letter-spacing:.3em;color:var(--accent);margin-bottom:8px}
.lock h1{font-size:20px;font-weight:600;margin:0 0 6px;letter-spacing:.03em}
.lock p.sub{margin:0 0 28px;color:var(--ink2);font-size:14.5px;line-height:1.7}
.lock input{width:100%;padding:14px 16px;font-size:19px;text-align:center;letter-spacing:.1em;border:1px solid var(--rule);background:var(--paper2);color:var(--ink);border-radius:4px;font-family:inherit;outline:none}
.lock input:focus{border-color:var(--accent)}
.lock button{width:100%;margin-top:12px;padding:14px;font-size:17px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:4px;font-family:inherit;letter-spacing:.08em}
.lock button:disabled{opacity:.55}
.lock .msg{margin-top:16px;font-size:14.5px;min-height:1.6em;color:var(--red)}
.lock .foot{margin-top:32px;font-size:13px;color:var(--ink2);line-height:1.8;border-top:1px solid var(--rule);padding-top:16px}
#doc{display:none}
</style></head><body>
